# Runs scripts/quickstart.sh --fast on every push.
#
# It was written at the same time as the quickstart, on a machine that was busy with a
# 31-day training run and could not execute either of them, so its first run on a public
# GitHub runner was the first time the quickstart executed anywhere. That run failed on the
# finite-difference check, on a gradient that was correct; Bulgular.md section 20 records it
# and the fix. The badge this job produces is the current claim about the engine: if it is
# red, believe the badge, not the documentation.

name: quickstart

on:
  push:
  pull_request:

jobs:
  quickstart:
    name: quickstart --fast (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The CPU wheel index: the GPU build is ~2.5 GB and nothing here needs CUDA.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3'
          python -m pip install -e .
          python -c "import lazy_lora, numpy, torch; print(numpy.__version__, torch.__version__)"

      # --fast skips the synthetic-weight suite, which writes ~330 MB. Everything that is
      # actually about this engine - the tiny checkpoint, shard integrity, the forward
      # pass, ten real training steps, the finite differences - still runs. quickstart.sh
      # exits non-zero if any step fails, so no extra assertion is needed here.
      #
      # Step 1 passes on a plain clone: the fifteen op fixtures are vendored at
      # tests/fixtures/ops/ under Apache-2.0, so the comparison against kimi-k3-in-c runs here.
      - name: Run the quickstart
        run: bash scripts/quickstart.sh --fast
