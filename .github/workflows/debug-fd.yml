# Temporary diagnostic workflow, not part of the project.
#
# The quickstart's finite-difference step failed on the residual-bank direction of the
# tiny synthetic model (analytic 1.086830 against a central difference of 1.121618, 3.1e-2
# relative, tolerance 2e-2). This job builds the same tiny model and runs
# scripts/debug_fd_bank.py, which sweeps eps and probes entries and single coordinates, to
# decide whether that is truncation error or a real gradient bug. It runs here rather than
# on the author's machine because that machine is busy with a 29-day training run.
#
# Delete this file once the question is settled.

name: debug-fd

on:
  push:
    branches: [debug/fd-bank]
  workflow_dispatch:

jobs:
  bank:
    name: residual-bank finite differences
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3'
          python -m pip install -e .

      - name: Build the tiny model
        run: |
          mkdir -p "$RUNNER_TEMP/demo/model"
          python scripts/make_tiny_model.py "$RUNNER_TEMP/demo/model" --seed 0

      - name: Probe the bank gradient
        env:
          LAZYLORA_COMPUTE_FP32: "1"
          LAZYLORA_MODEL_DIR: ${{ runner.temp }}/demo/model
          LAZYLORA_WORKSPACE_DIR: ${{ runner.temp }}/demo/ws
          LAZYLORA_FAST_SCRATCH_DIR: ${{ runner.temp }}/demo/scratch
          LAZYLORA_TRUNK_DIR: ""
          LAZYLORA_CACHE_DIR: ${{ runner.temp }}/demo/cache
          QS_SEQ_LEN: "64"
          QS_FD_LAYER: "3"
          QS_SEED: "0"
        run: python scripts/debug_fd_bank.py

      - name: Probe layer 1 as well
        if: always()
        env:
          LAZYLORA_COMPUTE_FP32: "1"
          LAZYLORA_MODEL_DIR: ${{ runner.temp }}/demo/model
          LAZYLORA_WORKSPACE_DIR: ${{ runner.temp }}/demo/ws
          LAZYLORA_FAST_SCRATCH_DIR: ${{ runner.temp }}/demo/scratch
          LAZYLORA_TRUNK_DIR: ""
          LAZYLORA_CACHE_DIR: ${{ runner.temp }}/demo/cache
          QS_SEQ_LEN: "64"
          QS_FD_LAYER: "1"
          QS_SEED: "0"
        run: python scripts/debug_fd_bank.py
